name: freee自動仕訳

on:
  schedule:
    - cron: '0 21 * * *'  # 毎日 6:00 JST
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DRY RUN（freeeに登録せず判定結果だけ確認する）'
        type: boolean
        default: false

jobs:
  auto-journal:
    runs-on: ubuntu-latest
    concurrency: freee-auto-journal  # 二重実行防止
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run freee auto journal
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FREEE_CLIENT_ID: ${{ secrets.FREEE_CLIENT_ID }}
          FREEE_CLIENT_SECRET: ${{ secrets.FREEE_CLIENT_SECRET }}
          FREEE_REFRESH_TOKEN: ${{ secrets.FREEE_REFRESH_TOKEN }}
          FREEE_COMPANY_ID: ${{ secrets.FREEE_COMPANY_ID }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node freee-auto-journal.js

      - name: Commit and push journal log
        if: always()
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config user.name "freee Auto Journal"
          git config user.email "optimizer@trainers-gym.com"
          git remote set-url origin "https://trainersgym00-creator:${PAT_TOKEN}@github.com/trainersgym00-creator/trainers-gym-lp-b.git"
          git add freee-journal-log.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "🧾 freee自動仕訳ログ $(date '+%Y-%m-%d')"
            git push origin HEAD
            echo "✅ 仕訳ログをpushしました"
          else
            echo "ℹ️ 変更なし - pushスキップ"
          fi
