<style id="basecss">
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

/* ---------- トークン（既定＝ライト） ---------- */
:root{
  --grn:#06c755;        /* LINEグリーン */
  --grn-d:#05a948;
  --grn-soft:#e8f8ee;
  --bg:#f2f4f7;         /* トーク背景 */
  --surface:#ffffff;    /* ヘッダー・吹き出し・カード */
  --surface2:#f7f8fa;
  --ink:#111418;
  --ink2:#5b6270;
  --ink3:#8a9099;
  --line:#e4e7ec;
  --line2:#eef0f4;
  --in-bg:#ffffff;      /* 相手の吹き出し */
  --in-ink:#111418;
  --out-bg:#06c755;     /* 自分の吹き出し */
  --out-ink:#ffffff;
  --warn:#e8452c;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.05);
  --r:18px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b1b1b; --surface:#242424; --surface2:#2b2b2b;
    --ink:#ececec; --ink2:#b3b8bf; --ink3:#8a9099;
    --line:#343434; --line2:#2e2e2e;
    --in-bg:#2b2b2b; --in-ink:#ececec;
    --grn-soft:#12331f;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#1b1b1b; --surface:#242424; --surface2:#2b2b2b;
  --ink:#ececec; --ink2:#b3b8bf; --ink3:#8a9099;
  --line:#343434; --line2:#2e2e2e;
  --in-bg:#2b2b2b; --in-ink:#ececec;
  --grn-soft:#12331f;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}

html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Yu Gothic","Noto Sans JP",Meiryo,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.7;-webkit-text-size-adjust:100%;
  font-size:15px;overscroll-behavior-y:none;
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;font-size:inherit;}
input{font-family:inherit;font-size:16px;}
a{color:inherit;text-decoration:none;}
:focus-visible{outline:2px solid var(--grn);outline-offset:2px;}

/* ---------- アプリの器 ---------- */
.app{
  max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;
  background:var(--bg);position:relative;overflow:hidden;
}

/* ---------- トークヘッダー ---------- */
.chat-hdr{
  flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--line);
  padding:max(6px,env(safe-area-inset-top)) 6px 6px;display:flex;align-items:center;gap:8px;z-index:20;
}
.hdr-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:20px;color:var(--ink2);flex-shrink:0;}
.hdr-btn:active{background:var(--surface2);}
.hdr-ava{width:36px;height:36px;border-radius:50%;background:var(--grn);color:#fff;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:18px;}
.hdr-nm{flex:1;min-width:0;}
.hdr-name{font-size:15px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-sub{font-size:11px;color:var(--ink3);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.pbar{height:3px;background:var(--line2);flex-shrink:0;overflow:hidden;}
.pbar-f{height:100%;width:0;background:var(--grn);transition:width .35s ease;}

/* ---------- トーク本文 ---------- */
.chat{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 12px 8px;-webkit-overflow-scrolling:touch;}
.daybar{text-align:center;margin:2px 0 14px;}
.daybar span{display:inline-block;background:rgba(0,0,0,.16);color:#fff;font-size:11px;font-weight:600;
  padding:3px 12px;border-radius:999px;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .daybar span{background:rgba(255,255,255,.14);}}
:root[data-theme="dark"] .daybar span{background:rgba(255,255,255,.14);}

.row{display:flex;gap:8px;margin-bottom:10px;align-items:flex-end;}
.row.out{flex-direction:row-reverse;}
.ava{width:34px;height:34px;border-radius:50%;background:var(--grn);color:#fff;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:17px;}
.ava.ghost{visibility:hidden;}
.bwrap{max-width:78%;display:flex;flex-direction:column;}
.row.out .bwrap{align-items:flex-end;}
.who{font-size:11px;color:var(--ink3);margin:0 0 3px 2px;}

.bub{
  padding:10px 14px;border-radius:var(--r);font-size:14.5px;line-height:1.72;
  word-break:break-word;white-space:pre-wrap;position:relative;
}
.row.in .bub{background:var(--in-bg);color:var(--in-ink);border-top-left-radius:5px;box-shadow:var(--shadow);}
.row.out .bub{background:var(--out-bg);color:var(--out-ink);border-top-right-radius:5px;font-weight:600;}
.bub b{font-weight:700;}
.bub .em{color:var(--grn);font-weight:700;}
.row.out .bub .em{color:#fff;}

.meta{font-size:10px;color:var(--ink3);margin:0 3px;align-self:flex-end;white-space:nowrap;flex-shrink:0;}
.row.out .meta{text-align:right;}
.meta .read{display:block;font-size:10px;color:var(--ink3);}

/* 打っている最中の表示 */
.typing{display:flex;gap:4px;padding:14px 16px;}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink3);opacity:.5;animation:blink 1.2s infinite;}
.typing i:nth-child(2){animation-delay:.2s;}
.typing i:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,60%,100%{opacity:.28;transform:translateY(0);}30%{opacity:.9;transform:translateY(-3px);}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none;opacity:.5;}}

/* ---------- カード（Flexメッセージ風） ---------- */
.card{background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);
  max-width:82%;margin-bottom:10px;margin-left:42px;}
.card-hd{background:var(--grn);color:#fff;padding:14px 16px;}
.card-hd .k{font-size:11px;opacity:.85;letter-spacing:1.5px;font-weight:700;}
.card-hd .n{font-size:30px;font-weight:800;line-height:1.15;margin-top:2px;}
.card-hd .n small{font-size:15px;font-weight:700;margin-left:6px;}
.card-bd{padding:14px 16px;}
.card-bd p{font-size:13.5px;color:var(--ink2);line-height:1.75;}
.card-kv{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;}
.card-kv span{font-size:11px;font-weight:700;background:var(--surface2);border:1px solid var(--line);
  padding:4px 10px;border-radius:999px;color:var(--ink2);}
.card-ft{border-top:1px solid var(--line2);}
.card-ft button{width:100%;padding:14px;font-size:14.5px;font-weight:700;color:var(--grn);}
.card-ft button:active{background:var(--surface2);}
.card-ft button+button{border-top:1px solid var(--line2);}

/* ---------- クイックリプライ ---------- */
.qr{flex-shrink:0;padding:8px 12px 10px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;}
.qr::-webkit-scrollbar{display:none;}
.qr.stack{flex-direction:column;overflow-x:visible;overflow-y:auto;max-height:46dvh;}
.qr:empty{display:none;}
.qr button{
  flex-shrink:0;background:var(--surface);border:1.5px solid var(--grn);color:var(--grn);
  padding:9px 16px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap;
  box-shadow:var(--shadow);
}
.qr.stack button{width:100%;white-space:normal;text-align:left;padding:12px 16px;line-height:1.5;}
.qr button:active{background:var(--grn);color:#fff;}
.qr button.sub{border-color:var(--line);color:var(--ink2);}
.qr button .n{display:inline-block;min-width:20px;font-weight:800;opacity:.75;}

/* ---------- 入力バー ---------- */
.ibar{flex-shrink:0;background:var(--surface);border-top:1px solid var(--line);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;}
.ibar.hide{display:none;}
.ibar input{flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:999px;
  padding:11px 16px;color:var(--ink);min-width:0;}
.ibar input::placeholder{color:var(--ink3);}
.ibar input:focus{outline:none;border-color:var(--grn);}
.ib-send{width:44px;height:44px;border-radius:50%;background:var(--grn);color:#fff;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;}
.ib-send:disabled{opacity:.35;}

/* ---------- リッチメニュー ---------- */
.rich{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  transform:translateY(101%);transition:transform .24s ease;z-index:30;
  padding-bottom:env(safe-area-inset-bottom);}
.rich.on{transform:translateY(0);}
@media (prefers-reduced-motion:reduce){.rich{transition:none;}}
.rich-g{display:grid;grid-template-columns:1fr 1fr;}
.rich-g button{padding:20px 10px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);
  display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--ink2);}
.rich-g button:nth-child(2n){border-right:none;}
.rich-g button:active{background:var(--surface2);}
.rich-g .ic{font-size:23px;}
.rich-g button:disabled{opacity:.34;}
.rich-cl{width:100%;padding:12px;font-size:13px;font-weight:700;color:var(--ink3);}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;
  transition:opacity .24s;z-index:25;}
.scrim.on{opacity:1;pointer-events:auto;}

/* ---------- 詳細レポート（全画面シート） ---------- */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column;
  max-width:480px;margin:0 auto;transform:translateY(100%);transition:transform .28s ease;}
.sheet.on{transform:translateY(0);}
@media (prefers-reduced-motion:reduce){.sheet{transition:none;}}
.sheet-hd{flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--line);
  padding:max(8px,env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:10px;}
.sheet-hd .t{flex:1;font-size:15px;font-weight:700;}
.sheet-bd{flex:1;overflow-y:auto;padding:16px 16px 40px;-webkit-overflow-scrolling:touch;}

/* ---------- レポート本文 ---------- */
.rep-hero{background:var(--surface);border-radius:16px;padding:22px 18px;text-align:center;box-shadow:var(--shadow);}
.rep-lbl{font-size:10.5px;letter-spacing:2.4px;color:var(--ink3);font-weight:700;}
.rep-num{font-size:62px;font-weight:800;line-height:1;color:var(--grn);margin:6px 0 2px;}
.rep-name{font-size:20px;font-weight:800;}
.rep-en{font-size:11px;letter-spacing:2px;color:var(--ink3);font-weight:700;margin-top:3px;}
.rep-catch{font-size:13.5px;color:var(--ink2);line-height:1.85;margin-top:11px;}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:13px;}
.chip{font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--surface2);
  border:1px solid var(--line);color:var(--ink2);}
.chip b{color:var(--grn);}

h3.sub{font-size:14px;font-weight:800;margin:24px 0 10px;display:flex;align-items:center;gap:8px;scroll-margin-top:70px;}
h3.sub::before{content:'';width:4px;height:15px;border-radius:2px;background:var(--grn);flex-shrink:0;}
h2.ttl{font-size:19px;font-weight:800;line-height:1.45;margin-bottom:13px;}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:2.4px;color:var(--grn);margin-top:30px;}
.box{background:var(--surface);border-radius:14px;padding:16px;box-shadow:var(--shadow);}
.muted{color:var(--ink2);font-size:13px;line-height:1.85;}
.mini{font-size:11.5px;color:var(--ink3);line-height:1.8;}

.conf{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;border-radius:12px;margin-top:12px;
  background:var(--grn-soft);border:1px solid rgba(6,199,85,.3);}
.conf.mid{background:#fff6e5;border-color:#ffd591;}
.conf.low{background:#feeceb;border-color:#f8bfb8;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .conf.mid{background:#332a15;border-color:#5c4a1e;}
  :root:not([data-theme="light"]) .conf.low{background:#3a1f1c;border-color:#663230;}}
:root[data-theme="dark"] .conf.mid{background:#332a15;border-color:#5c4a1e;}
:root[data-theme="dark"] .conf.low{background:#3a1f1c;border-color:#663230;}
.conf-i{font-size:18px;line-height:1.4;flex-shrink:0;}
.conf-t{font-size:12.5px;font-weight:800;margin-bottom:2px;}
.conf-d{font-size:11.5px;color:var(--ink2);line-height:1.7;}

.chart{background:var(--surface);border-radius:14px;padding:10px 4px 4px;box-shadow:var(--shadow);}
svg{display:block;width:100%;height:auto;}
.rdr-ring{stroke:var(--line);}
.rdr-ring.out{stroke:var(--ink3);stroke-opacity:.55;}
.rdr-axis{stroke:var(--line2);}

  strengths:["共感力が高く、相手の必要をすぐに察知できる","温かく、人を安心させる力がある","面倒見がよく、人間関係を育てるのがうまい","惜しみなく与えられる寛大さ"],
  pitfalls:["自分の欲求が分からなくなるほど、後回しにする","見返りへの期待が裏切られると、強い怒りに変わる","相手にとって「必要な存在」であろうと踏み込みすぎる","No が言えず、抱え込んで潰れる"],
  gw:{n:4,t:"4の健全さを取り込む。人のためではなく「自分の本当の気持ち」に向き合えるようになると、与えることが取引ではなく純粋な喜びに変わります。"},
  sd:{n:8,t:"8の不健全さが出る。「こんなにしてあげたのに」と支配的・攻撃的になり、感情をぶつけてしまいます。"},
  wings:{a:{k:"2w1",n:"奉仕者",t:"1の使命感が加わり、「やるべきだから助ける」責任型。誠実で、奉仕に倫理的な意味を見出す。"},
         b:{k:"2w3",n:"ホスト",t:"3の社交性が加わり、人を惹きつける魅力型。場を明るくし、人脈を広げるのが得意。"}},
  gym:{style:"人とのつながりで続くタイプ。トレーナーとの信頼関係そのものが最大の燃料になります。グループレッスンも有効。",
    motiv:"「誰かのために健康でいる」という文脈。ただし自分軸への転換も必要。",
    risk:"家族・仕事・人の世話を優先して、自分の予約を後回しにし、いつのまにか来なくなる。",
    food:"人と食事を合わせる場面で崩れやすい。断れないことが最大の壁。",
    hint:"「自分を整えることが、周りを支える力になる」と目的を再定義する。自分のための時間を、先に予定表に確保します。"},
  trainer:{talk:["あなたが元気でいることが、周りにとって一番の支えになります","今日は誰のためでもなく、自分のために来ましたね","無理なときは断ってくれて大丈夫ですよ"],
    ng:["事務的・機械的な対応（関係が切れたと感じ、モチベーションが急落します）","感謝を伝えないまま指導だけする"],
    goal:"人を巻き込む目標設定（家族と歩く等）＋「自分のための時間」を明文化してセットに。"}},

3:{name:"達成する人",en:"THE ACHIEVER",catch:"結果で語る人。前に進み続けることで、自分の価値を証明する。",
  center:"感情",centerDesc:"恥",
  want:"価値ある存在でありたい／成功を認められたい",fear:"無価値だと思われること・失敗して見捨てられること",
  passion:"欺瞞（成果のために自分を演出し、本当の感情を見失う）",virtue:"誠実さ",
  strengths:["目標達成力が圧倒的。決めたら結果まで持っていく","効率がよく、要領を掴むのが速い","自信があり、周囲を巻き込んで動かす推進力がある","適応力が高く、場に合わせて能力を発揮できる"],
  pitfalls:["結果が出ないと、自分の存在価値まで否定してしまう","立ち止まれず、燃え尽きるまで走る","本音や弱さを見せられず、孤独になりやすい","人と比べて、勝ち負けで自分を測る"],
  gw:{n:6,t:"6の健全さを取り込む。成果ではなく「仲間への誠実さ」「協力」に価値を置けるようになると、走る理由が自分の内側から生まれます。"},
  sd:{n:9,t:"9の不健全さが出る。頑張れなくなり、無気力に。何もしていない自分を直視できず、ぼんやりと時間を潰してしまいます。"},
  wings:{a:{k:"3w2",n:"魅了する人",t:"2の対人性が加わり、人を惹きつけるカリスマ型。人望と成果を同時に取りにいく。"},
         b:{k:"3w4",n:"プロフェッショナル",t:"4の内面性が加わり、質と独自性にこだわる専門家型。ただ勝つのではなく「良いもの」で認められたい。"}},
  gym:{style:"数値・記録・PB更新。ビフォーアフター。競争性のある環境で最も伸びます。目に見える指標が原動力。",
    motiv:"目標の可視化と達成の実感。順位や記録更新は効果絶大。",
    risk:"結果を急ぎすぎてオーバーワーク・怪我。そして停滞期（プラトー）に入ると、価値を感じられず一気に離脱する。",
    food:"効率重視で極端な制限に走り、リバウンドを繰り返しやすい。",
    hint:"体重以外の「過程の指標」（出席率・睡眠・挙上重量）を必ず持つこと。結果が止まっても続く仕組みを作ります。"},
  trainer:{talk:["今週の勝ちポイントは体重じゃなく「出席率10割」です","停滞期はこの時期に必ず来ます。想定内です","今日は休むという判断ができたのが、成長です"],
    ng:["人前で失敗を強調する（強い恥を感じ、来なくなります）","根拠のない精神論だけの励まし"],
    goal:"短期マイルストーンを複数設定し、停滞期の存在を最初に共有しておく。"}},

4:{name:"個性的な人",en:"THE INDIVIDUALIST",catch:"深さを求める人。自分だけの意味を生きようとする。",
  center:"感情",centerDesc:"恥",
  want:"自分自身でありたい／唯一無二の意味を持ちたい",fear:"平凡で、取るに足らない存在であること",
  passion:"妬み（自分に欠けているものを、人の中に見てしまう）",virtue:"平常心",
  strengths:["感受性が豊かで、人の痛みを深く理解できる","独自の感性と創造性がある","本音で向き合える誠実さ。表面的な関係で終わらせない","苦しい状況にも意味を見出す力"],
  pitfalls:["気分の波が大きく、行動が安定しない","人と比べて「自分にはない」と落ち込みやすい","感情に浸りすぎて、行動が止まる","特別でない自分を認められず、日常を軽んじる"],
  gw:{n:1,t:"1の健全さを取り込む。感情に関係なく「決めたことを淡々とやる」規律を持てたとき、才能がはじめて形になります。"},
  sd:{n:2,t:"2の不健全さが出る。人にしがみつき、承認を過剰に求め、相手の反応に一喜一憂してしまいます。"},
  wings:{a:{k:"4w3",n:"貴族",t:"3の推進力が加わり、自分の世界観を外に発信する表現者型。洗練を求め、成果にもこだわる。"},
         b:{k:"4w5",n:"ボヘミアン",t:"5の探究心が加わり、内面世界を深く掘る芸術家型。独自性が強く、孤高になりやすい。"}},
  gym:{style:"画一的なメニューより、自分のために組まれた特別感。空間・音楽・世界観への共感が継続に直結します。",
    motiv:"「なりたい自分の像」との接続。数値より、意味とストーリー。",
    risk:"気分の波でムラが大きい。人と比べて落ち込み、「自分には向いていない」と物語化して離脱する。",
    food:"感情と食が強く結びつき、落ち込むと過食・拒食に振れやすい。",
    hint:"「気分が乗らない日用の最小メニュー」を先に用意する。やる気ではなく、仕組みで乗り切ります。"},
  trainer:{talk:["調子が乗らない日も想定して、このメニューを作りました","あなたの体質・骨格に合わせるとこうなります","今の気分はどうですか？そこから今日の強度を決めましょう"],
    ng:["「みんなこうしてますよ」（没個性化され、一気に冷めます）","感情を軽く扱う・急かす"],
    goal:"数値目標の前に「どうなりたいか」を一緒に言語化する。意味づけが定まれば継続力は跳ね上がります。"}},

5:{name:"調べる人",en:"THE INVESTIGATOR",catch:"理解することで安心する人。自分の世界を守り、深く掘る。",
  center:"思考",centerDesc:"恐れ",
  want:"有能でありたい／理解し、自分の力で立ちたい",fear:"無力で、消耗させられ、侵食されること",
  passion:"強欲（時間・エネルギー・知識を出し惜しみして蓄える）",virtue:"無執着",
  strengths:["客観的で、感情に流されない分析力","一つのことを人より深く掘り下げられる","冷静沈着。危機の場面でも取り乱さない","独立心が強く、自分で完結できる"],
  pitfalls:["準備・情報収集で満足し、行動が遅れる","人との関わりを削り、孤立しやすい","感情を切り離しすぎて、体の声に気づかない","「まだ分かっていない」を理由に始められない"],
  gw:{n:8,t:"8の健全さを取り込む。頭で完結せず「まず体で動く」勇気を持てたとき、知識が現実を動かす力に変わります。"},
  sd:{n:7,t:"7の不健全さが出る。集中が散り、次々と新しい情報に飛びつき、落ち着きなく浅い刺激を追ってしまいます。"},
  wings:{a:{k:"5w4",n:"独創家",t:"4の感性が加わり、独自の世界観を持つ探究者。知性と芸術性が同居する。"},
         b:{k:"5w6",n:"問題解決者",t:"6の実務性が加わり、専門知識を現実の課題解決に使う実践派。堅実で、信頼を積み上げる。"}},
  gym:{style:"理論とデータ。なぜこの種目なのか、仕組みが腹落ちすると自走します。一人で黙々と取り組める環境が最適。",
    motiv:"エビデンスと数値。自分でログを設計させると強い。",
    risk:"調べることで満足して実行に移らない。人が多い時間帯や過度な干渉で消耗し、足が遠のく。",
    food:"知識は完璧なのに、実践が続かないというギャップが起きやすい。",
    hint:"「調べる時間」に上限を決め、最小限の実行ルール（3種目だけ等）に落とし込むこと。"},
  trainer:{talk:["理由はこうです。まずはこの3種目だけで十分です","数値はこちらで記録しておきます。見返せるようにしますね","今日は質問がなければ、黙々といきましょう"],
    ng:["過度にハイテンションな励まし・急かす声かけ（消耗させます）","根拠を示さない指示"],
    goal:"学習欲を活かし、記録フォーマットを本人に設計してもらう。理解＝継続の燃料になります。"}},

6:{name:"忠実な人",en:"THE LOYALIST",catch:"備える人。不安を力に変え、仲間を守り抜く。",
  center:"思考",centerDesc:"恐れ",
  want:"安全でありたい／信頼できる支えが欲しい",fear:"支えを失い、独りで対処できなくなること",
  passion:"恐れ（最悪を想定し続ける習性）",virtue:"勇気",
  strengths:["責任感が強く、約束を守り抜く","リスク察知能力が高く、備えを怠らない","仲間思いで、信頼した相手には徹底的に忠実","誠実で、地に足がついた判断ができる"],
  pitfalls:["決断に時間がかかり、決めた後も迷い続ける","考えすぎて不安を増幅させる","人を信じたいのに疑ってしまい、試すような行動をとる","うまくいっている時ほど不安になる"],
  gw:{n:9,t:"9の健全さを取り込む。「大丈夫かどうか」を手放し、今この瞬間に落ち着けるようになると、不安が静かな安心に変わります。"},
  sd:{n:3,t:"3の不健全さが出る。不安を打ち消すために働きすぎ、成果を追って自分を追い込みます。"},
  wings:{a:{k:"6w5",n:"守護者",t:"5の分析力が加わり、慎重で思慮深い。情報を固めてから動く堅実型。"},
         b:{k:"6w7",n:"バディ",t:"7の陽気さが加わり、人懐こく行動的。不安を人と分かち合いながら前へ進む。"}},
  gym:{style:"手順が明確で、いつでも確認できる環境。信頼できるトレーナーが一人つけば、最も長く続くタイプです。",
    motiv:"安心。不安を先回りして潰してもらえることが最大の動機づけ。",
    risk:"「本当にこれで合っているのか」と不安になり、方針をころころ変える。情報過多で迷子になる。",
    food:"心配のあまり調べすぎ、極端な情報に振り回されやすい。",
    hint:"情報源を1つに絞る合意をする。「迷ったらこの人に聞く」を決めるだけで、継続率が大きく変わります。"},
  trainer:{talk:["不安なところ、先に全部潰しておきましょう","この種目が効く理由と、危ないケースを両方お伝えします","何かあればいつでも聞いてください。それが普通です"],
    ng:["曖昧な説明、根拠のない「大丈夫です」（かえって不安が増します）","担当や方針をころころ変える"],
    goal:"想定される不安と、その対処法をセットで書き出す。「もしこうなったら、こうする」を用意しておく。"}},

7:{name:"熱中する人",en:"THE ENTHUSIAST",catch:"可能性に生きる人。楽しさで、世界を明るくする。",
  center:"思考",centerDesc:"恐れ",
  want:"満たされたい／自由に、可能性を味わい尽くしたい",fear:"苦痛や退屈に閉じ込められること",
  passion:"暴食（刺激・体験・選択肢を求め続ける）",virtue:"節制",
  strengths:["発想力が豊かで、次々にアイデアが出る","切り替えが早く、逆境でも明るさを失わない","好奇心が強く、行動範囲が広い","場を楽しくする力があり、人を巻き込める"],
  pitfalls:["飽きっぽく、始めたものを終わらせられない","地味な反復や、深掘りが苦手","痛みや向き合うべき問題から目を逸らす","選択肢を残しすぎて、何も決まらない"],
  gw:{n:5,t:"5の健全さを取り込む。一つのことに腰を据えて深く関わったとき、はじめて本当の充実が手に入ります。"},
  sd:{n:1,t:"1の不健全さが出る。急に完璧主義的・批判的になり、自分にも人にも厳しく苛立ちます。"},
  wings:{a:{k:"7w6",n:"エンターテイナー",t:"6の協調性が加わり、人と一緒に楽しむ社交型。責任感もあり、仲間を大切にする。"},
         b:{k:"7w8",n:"現実主義者",t:"8の行動力が加わり、欲しいものを実際に掴みにいく実行型。パワフルでスピードがある。"}},
  gym:{style:"バリエーションとゲーム性。飽きさせない工夫が全て。仲間とワイワイやれる環境で驚くほど続きます。",
    motiv:"新しさ・楽しさ・選べること。イベント性のある目標が効く。",
    risk:"飽きたら来なくなる。地味な基礎種目と停滞期に極端に弱い。",
    food:"我慢型の食事管理が最も苦手。禁止されるほど反発します。",
    hint:"「3つの中から今日のメニューを選ぶ」形式にする。制限ではなく、選択肢の中で設計するのがコツ。"},
  trainer:{talk:["今日は3パターン用意しました。どれにします？","来月、記録会やりましょう。目標にしませんか","これ、たぶんまだやったことないやつです"],
    ng:["「これを3ヶ月ずっと続けてください」（想像しただけで苦しくなります）","禁止事項を並べるだけの食事指導"],
    goal:"短いスパンで区切り、変化とご褒美を設計に組み込む。ゴールは常に「楽しそう」であること。"}},

8:{name:"挑戦する人",en:"THE CHALLENGER",catch:"力で道を切り拓く人。自分と仲間を、誰にも侵させない。",
  center:"本能",centerDesc:"怒り",
  want:"強くありたい／自分の人生を自分で決めたい",fear:"人に支配され、傷つけられること",
  passion:"色欲（強さ・刺激・過剰さへの渇望）",virtue:"無垢さ",
  strengths:["圧倒的な行動力と決断力","逆境に強く、責任を引き受ける","率直で裏表がない","仲間や弱い立場の人を全力で守る"],
  pitfalls:["強引になり、周囲を萎縮させる","弱さを見せられず、限界まで抱え込む","怒りの表出が早く、関係を壊すことがある","休息を「弱さ」と見なして無視する"],
  gw:{n:2,t:"2の健全さを取り込む。守るだけでなく、素直に人に心を開けたとき、本当の強さが手に入ります。"},
  sd:{n:5,t:"5の不健全さが出る。人を遮断して引きこもり、警戒しながら一人で抱え込みます。"},
  wings:{a:{k:"8w7",n:"独立独歩",t:"7の推進力が加わり、行動的でスピード感のある開拓型。次々と勝負を仕掛ける。"},
         b:{k:"8w9",n:"守る者",t:"9の落ち着きが加わり、どっしりと構える重量級。普段は穏やかだが、いざという時に圧倒的。"}},
  gym:{style:"高強度で限界に挑む設計。主導権を自分が握れる形にすると、爆発的に伸びます。",
    motiv:"挑戦と勝負。「これができたら本物です」という提示が効く。",
    risk:"オーバーワークと、痛みを我慢して続けることによる怪我。一方的な指図には強く反発する。",
    food:"極端に振れやすく、やるときは完璧、崩れるときは一気。",
    hint:"「休むことも強さ」と再定義する。回復を戦略として位置づけると、素直に受け入れられます。"},
  trainer:{talk:["今日は追い込まない、が今日の課題です","AとB、どちらでいきますか","率直に言います。今の重量は関節に対して早いです"],
    ng:["一方的な指示・子供扱い（即座に反発を招きます）","遠回しな言い方でごまかす"],
    goal:"選択権を渡した上で、限界を提示する。「決めるのは本人」という形が最も機能します。"}},

9:{name:"平和をもたらす人",en:"THE PEACEMAKER",catch:"調和を保つ人。そこにいるだけで、場が穏やかになる。",
  center:"本能",centerDesc:"怒り",
  want:"心の平安／調和した、波風のない状態",fear:"分離・喪失・対立に巻き込まれること",
  passion:"怠惰（自分自身に関わることを後回しにする）",virtue:"行動",
  strengths:["穏やかで、人を安心させる包容力","偏りなく、複数の立場を理解できる","粘り強く、一度習慣化すると崩れない","対立を和らげ、場をまとめる力"],
  pitfalls:["自分の意見や欲求が分からなくなる","大事なことほど先延ばしにする","不満を溜め込み、突然限界がくる","流れに身を任せ、変化を起こせない"],
  gw:{n:3,t:"3の健全さを取り込む。自分の目標に向けて主体的に動き出したとき、眠っていた力が一気に立ち上がります。"},
  sd:{n:6,t:"6の不健全さが出る。不安と疑いが強まり、心配ばかりが増えて動けなくなります。"},
  wings:{a:{k:"9w8",n:"仲裁者",t:"8の力強さが加わり、穏やかだが芯が強い。必要な場面ではしっかり主張する。"},
         b:{k:"9w1",n:"夢見る人",t:"1の理想が加わり、静かな理想主義者。秩序を好み、正しさを穏やかに守る。"}},
  gym:{style:"穏やかなペースで、ルーティン化。習慣にさえなれば、9タイプ中もっとも長く続きます。",
    motiv:"考えなくていい状態。決めるストレスがないほど続く。",
    risk:"そもそも始まらない・予約が先延ばしになる。強度が上がらず、変化が出ないまま停滞する。",
    food:"気づかないうちに元の習慣に戻っている。無自覚な後退が起きやすい。",

/* ---------- 出題順 ---------- */
function buildSeq(mode){
  var rounds=(mode==='quick')?4:10, seq=[], r,i,t;
  for(r=0;r<rounds;r++){
    for(i=0;i<9;i++){
      t=((r+i*4)%9)+1;          /* 4ずつ飛ばす（9と互いに素なので1周で全タイプを網羅） */
      seq.push({k:'t'+t+'_'+r,kind:'type',t:t,q:QT[t][r]});
    }
  }
  if(mode==='deep'){
    var ord=['sp','so','sx'];
    for(r=0;r<4;r++){
      for(i=0;i<3;i++){
        var g=ord[(r+i)%3];
        seq.push({k:g+'_'+r,kind:'inst',g:g,q:QI[g][r]});
      }
    }
  }
  return seq;
}

/* ---------- 採点 ---------- */
function score(){
  var per=state.mode==='quick'?4:10, raw={},pct={},t,r,v,sum;
  for(t=1;t<=9;t++){
    sum=0;
    for(r=0;r<per;r++){ v=state.ans['t'+t+'_'+r]; sum+=(typeof v==='number'?v:3); }
    raw[t]=sum;
    pct[t]=Math.round(((sum-per)/(per*4))*1000)/10;   /* 1〜5 → 0〜100% */
  }
  var order=[];
  for(t=1;t<=9;t++) order.push({t:t,p:pct[t],raw:raw[t]});
  order.sort(function(a,b){return b.p-a.p||a.t-b.t;});

  var inst=null;
  if(state.mode==='deep'){
    inst={};
    ['sp','so','sx'].forEach(function(g){
      var s=0;
      for(r=0;r<4;r++){ v=state.ans[g+'_'+r]; s+=(typeof v==='number'?v:3); }
      inst[g]=Math.round(((s-4)/16)*1000)/10;
    });
  }
  return {pct:pct,order:order,inst:inst,per:per};
}

function wingOf(t,pct){
  var a=(t===1)?9:t-1, b=(t===9)?1:t+1, w=TYPES[t].wings;
  return (pct[a]>=pct[b])?{n:a,d:w.a}:{n:b,d:w.b};
}

}

/* ---------- レーダーチャート ---------- */
function radar(pct){
  var cx=170,cy=158,R=112,i,t,ang,x,y,rings='',axes='',labels='',pts=[];
  for(i=1;i<=4;i++){
    var rr=R*i/4,pp=[];
    for(t=0;t<9;t++){
      ang=-Math.PI/2+t*2*Math.PI/9;
      pp.push((cx+rr*Math.cos(ang)).toFixed(1)+','+(cy+rr*Math.sin(ang)).toFixed(1));
    }
    rings+='<polygon class="rdr-ring'+(i===4?' out':'')+'" points="'+pp.join(' ')+'" fill="none" stroke-width="1"/>';
  }
  for(t=0;t<9;t++){
    ang=-Math.PI/2+t*2*Math.PI/9;
    x=cx+R*Math.cos(ang); y=cy+R*Math.sin(ang);
    axes+='<line class="rdr-axis" x1="'+cx+'" y1="'+cy+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke-width="1"/>';
    var lx=cx+(R+20)*Math.cos(ang), ly=cy+(R+20)*Math.sin(ang);
    labels+='<text class="rdr-lbl" x="'+lx.toFixed(1)+'" y="'+(ly+5).toFixed(1)+'" text-anchor="middle" font-size="15">'+(t+1)+'</text>';
    var val=Math.max(0,Math.min(100,pct[t+1]))/100;
    pts.push((cx+R*val*Math.cos(ang)).toFixed(1)+','+(cy+R*val*Math.sin(ang)).toFixed(1));
  }
  var dots='';
  pts.forEach(function(p){var c=p.split(',');dots+='<circle class="rdr-dot" cx="'+c[0]+'" cy="'+c[1]+'" r="3" fill="#06c755"/>';});
  return '<svg viewBox="0 0 340 330" role="img" aria-label="9タイプのスコア分布">'
    +'<defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">'
    +'<stop offset="0%" stop-color="#06c755" stop-opacity=".42"/>'
    +'<stop offset="100%" stop-color="#06c755" stop-opacity=".14"/></linearGradient></defs>'
    +rings+axes+'<polygon points="'+pts.join(' ')+'" fill="url(#rg)" stroke="#06c755" stroke-width="2"/>'
    +dots+labels+'</svg>';
}

var OPT_ICON=['','①','②','③','④','⑤'];

function startQuiz(mode){
  state.mode=mode; state.seq=buildSeq(mode); state.idx=0; state.ans={};
  step='quiz';
  sayLater('では、はじめます。全'+state.seq.length+'問です。\nいちばん近いものを選んでください。',700)
  .then(askQ);
}

function resumeQuiz(p){
  state.mode=p.mode||'full'; state.seq=buildSeq(state.mode);
  state.idx=p.idx||0; state.ans=p.ans||{};
  if(p.person)person=p.person;
  step='quiz';
  sayLater('おかえりなさい。'+(state.idx+1)+'問目から再開します。',600).then(askQ);
}

function askQ(){
  var item=state.seq[state.idx];
  if(!item){ finish(); return; }
  progress(state.idx+1,state.seq.length);
  var head='<b>Q'+(state.idx+1)+'.</b>　'+esc(item.q);
  sayLater(head,300).then(function(){
    quick(OPTS.map(function(o){
      return {html:'<span class="n">'+OPT_ICON[o.v]+'</span> '+esc(o.l),
              on:function(){ answer(o.v,o.l); }};
    }),true);
  });
}

function answer(v,label){
  var item=state.seq[state.idx];
  if(!item)return;
  state.ans[item.k]=v;
  me(label);
  /* 保存は次の問題に進めてから。回答済みの問題を再開時に聞き直さないため */
  if(state.idx<state.seq.length-1){ state.idx++; save(); askQ(); }
  else{ finish(); }
}

  var res=score();
  lastRes=res;
  progress(0,0);

  try{

      {mode:state.mode,pct:res.pct,inst:res.inst,person:person,org:ORG,ts:Date.now()}));
  }catch(e){}
  showResult(res);
}

function showResult(res){
  var t=res.order[0].t, T=TYPES[t], wing=wingOf(t,res.pct);
  renderReport(res);

  sayLater('お疲れさまでした。結果が出ました。',600).then(function(){
    return sayLater('あなたの基本タイプは <b class="em">タイプ'+t+'　'+esc(T.name)+'</b> です。',700);
  }).then(function(){
    cardMsg(
      '<div class="card-hd"><div class="k">YOUR BASIC TYPE</div>'
      +'<div class="n">'+t+'<small>'+esc(T.name)+'</small></div></div>'
      +'<div class="card-bd"><p>'+esc(T.catch)+'</p>'
      +'<div class="card-kv"><span>ウィング '+wing.d.k+'</span>'
      +'<span>'+T.center+'センター</span><span>一致度 '+res.order[0].p+'%</span></div></div>'
      +'<div class="card-ft"><button id="cardReport">詳しい結果を見る</button></div>'
    );
    $('cardReport').onclick=openSheet;
    return sayLater('「詳しい結果を見る」を押すと、あなたに向いているトレーニングの続け方まで確認できます。',800);
  }).then(function(){
    var items=[{label:'詳しい結果を見る', on:function(){ me('詳しい結果を見る'); openSheet(); }}];
    if(SEND_ENDPOINT&&person.agree){
      items.push({label:'結果を送ってもらう', on:function(){ me('結果を送ってもらう'); openSheet(); setTimeout(doSend,350); }});
    }
    items.push({label:'もう一度診断する', sub:true, on:function(){ me('もう一度診断する'); restart(); }});
    quick(items,true);
    updateRich();
  });
}

/* ---------- リッチメニュー ---------- */
function toggleRich(on){
  $('rich').classList.toggle('on',on);
  $('scrim').classList.toggle('on',on);
}
function updateRich(){
  var done=!!lastRes;
  $('rmReport').disabled=!done;
  $('rmPrint').disabled=!done;
  $('rmSend').disabled=!(done&&person.agree);
  $('rmOrg').disabled=false;
}

function restart(){
  clearProgress();
  lastRes=null; person={name:"",unit:"",email:"",agree:false};
  state={mode:'full',seq:[],idx:0,ans:{}};
  updateRich();
  chat.innerHTML=''; firstIn=true; dayBar('今日');
  greet(false);
}

/* 診断の途中で事業を切り替えると、結果が別の事業に混ざるため確認する */
function switchOrg(){
  if(step==='quiz'){
    say('診断の途中です。事業を切り替えると、<b>いまの回答は破棄</b>されて最初からになります。');
    quick([
      {label:'切り替える', on:function(){ me('切り替える'); clearProgress(); pickOrg(); }},
      {label:'このまま続ける', sub:true, on:function(){ me('このまま続ける'); askQ(); }}
    ],true);
    return;
  }
  pickOrg();
}

function loadProgress(){
  try{
    var p=JSON.parse(localStorage.getItem(LS_P)||'null');
    if(p&&p.org===ORG&&p.idx>0&&p.ans)return p;
  }catch(e){}
  return null;
}
function clearProgress(){ try{localStorage.removeItem(LS_P);}catch(e){} }

function openSheet(){ $('sheet').classList.add('on'); $('resBody').scrollTop=0; }
function closeSheet(){ $('sheet').classList.remove('on'); }

   + '<p class="muted">'+esc(C.desc)+'</p>'

  h+='</ul><div class="coach-h" style="margin-top:14px">目標設定のコツ</div>'

}

/* ---------- 送信 ---------- */
function buildPdfHtml(){
  var css=$('basecss').textContent+'\n'+$('printcss').textContent;
  return '<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">'
    + '<title>'+esc(BRAND.name)+' エニアグラム診断 '+esc(person.name)+'</title>'
    + '<style>'+css+'</style></head><body><div class="sheet"><div class="sheet-bd">'
    + $('resBody').innerHTML
    + '</div></div></body></html>';
}

function doSend(){
  if(!lastRes||!SEND_ENDPOINT)return;
  var res=lastRes, t=res.order[0].t, wing=wingOf(t,res.pct);
  var btn=$('btnSend'), st=$('sendSt');
  if(!btn||!st)return;
  function show(cls,msg){ st.className='send-st on '+cls; st.innerHTML=msg; }
  btn.disabled=true;
  show('wait','送信しています…');

  fetch(SEND_ENDPOINT,{
    method:'POST',
    /* text/plain にすることでプリフライトを避ける（Apps Script側は生のBodyを読む） */
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({
      org:ORG, brand:BRAND.name,
      name:person.name, unit:person.unit, email:person.email,
      type:t, typeName:TYPES[t].name, wing:wing.d.k, center:TYPES[t].center,
      mode:state.mode, questions:(state.mode==='quick'?36:(state.mode==='deep'?102:90)),
      scores:res.pct, instinct:res.inst||null,
      date:fmtDate(), summary:summaryText(res,t,wing),
      html:buildPdfHtml()
    })
  }).then(function(r){return r.json();}).then(function(j){
    if(!j||!j.ok) throw new Error((j&&j.error)||'不明なエラー');
    show('done','送信しました。'+esc(BRAND.owner)+'に結果PDFを共有済みです。'
      +(person.email?'<br>ご本人（'+esc(person.email)+'）にも同じPDFをお送りしました。':''));
    toast('結果を送信しました');
  }).catch(function(err){
    show('ng','送信できませんでした（'+esc(String(err.message||err))+'）。<br>'
      +'「保存・印刷」からPDFを保存して、お手数ですが手動で共有してください。');
    btn.disabled=false;
  });
}

/* メールアプリを開いて送る。サーバー不要で、その場ですぐ使える。 */
function mailSubject(t){
  return '【'+BRAND.name+(person.unit?'／'+person.unit:'')+'】'
    + (person.name||'匿名')+' さん：タイプ'+t+' '+TYPES[t].name;
}
function sendByMail(res,t,wing){
  var to=HQ_MAIL;
  if(person.email) to+=','+person.email;
  var url='mailto:'+encodeURIComponent(to)
    + '?subject='+encodeURIComponent(mailSubject(t))
    + '&body='+encodeURIComponent(summaryText(res,t,wing));
  location.href=url;
  toast('メールアプリを開きます');
}

/* 端末の共有メニューを開く（LINE・メールなどに渡せる） */
function shareResult(res,t,wing){
  var txt=summaryText(res,t,wing);
  if(navigator.share){
    navigator.share({title:mailSubject(t),text:txt}).catch(function(){});
  }else{
    copyText(txt);
    toast('結果をコピーしました。貼り付けて送ってください');
  }
}

function summaryText(res,t,wing){
  var T=TYPES[t], L=[];
  L.push('【エニアグラム診断結果／'+BRAND.name+'】');
  L.push('お名前：'+(person.name||'—')+(person.unit?'　'+BRAND.unitLabel+'：'+person.unit:''));
  L.push('診断日：'+fmtDate());
  L.push('基本タイプ：'+t+' '+T.name+'（'+T.en+'）');
  L.push('ウィング：'+wing.d.k+' '+wing.d.n);
  L.push('センター：'+T.center+'（'+CENTERS[T.center].core+'）');
  if(res.inst){
    var ig=['sp','so','sx'].sort(function(a,b){return res.inst[b]-res.inst[a];});
    L.push('本能サブタイプ：'+INSTINCT[ig[0]].n);
  }
  L.push('');
  L.push('■ スコア');
  res.order.forEach(function(x){ L.push('  タイプ'+x.t+' '+TYPES[x.t].name+'：'+x.p+'%'); });
  L.push('');
  L.push('■ 根源的欲求：'+T.want);
  L.push('■ 根源的恐れ：'+T.fear);
  L.push('');
  L.push('■ 向いているスタイル');   L.push('  '+T.gym.style);
  L.push('■ 挫折パターン');         L.push('  '+T.gym.risk);
  L.push('■ 継続のカギ');           L.push('  '+T.gym.hint);
  L.push('');
  L.push('■ 指導のポイント（目標設定）'); L.push('  '+T.trainer.goal);
  return L.join('\n');
}

function copyText(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){toast('結果をコピーしました');},function(){fallbackCopy(txt);});
  }else{ fallbackCopy(txt); }
}
function fallbackCopy(txt){
  var ta=document.createElement('textarea');
  ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('結果をコピーしました'); }
  catch(e){ toast('コピーできませんでした'); }
  document.body.removeChild(ta);
}

applyBrand();

chat.innerHTML=''; firstIn=true; dayBar('今日');
greet(!!loadProgress());
